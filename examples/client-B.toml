# meshly-core client example: mixed provider + consumer on the same host.
# Replace `server_node_id` with the value printed by `meshly-core-client id` on the
# server host. Each client MUST use a distinct identity_path.

server_node_id = "REPLACE_ME_WITH_SERVER_NODE_ID_FROM_meshly-core-client-id"
group_token = "long-random-string-shared-with-clients"

[common]
identity_path = "./keys/consumer.key"

[common.logging]
level = "info"

[[expose]]
name = "ssh"
local_addr = "127.0.0.1:22"
shared_secret = "ssh-secret"

[[consume]]
name = "web"
local_bind = "127.0.0.1:19090"
shared_secret = "web-secret"

[reconnect]
initial_backoff_ms = 50
max_backoff_ms = 5000
prefer_direct = true