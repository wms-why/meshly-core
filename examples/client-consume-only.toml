# meshly-core client consume-only example.
# Subscribes to a remote service exposed by a peer; never publishes.
# Replace `server_node_id` with the value printed by `meshly-core-client id` on the
# server host. Set `[common].identity_path` to a path distinct from any
# other meshly-core process on this machine.

server_node_id = "REPLACE_ME_WITH_SERVER_NODE_ID_FROM_meshly-core-client-id"
group_token    = "long-random-string-shared-with-clients"

[common]
identity_path = "./keys/consumer.key"

[common.logging]
level = "info"

[[consume]]
name          = "lan-db"
local_bind    = "127.0.0.1:3307"
shared_secret = "db-secret-from-remote-host"

[reconnect]
initial_backoff_ms = 50
max_backoff_ms     = 5000
prefer_direct      = true