# meshly-core client example: provider-only.
# Replace `server_node_id` with the value printed by `meshly-core-client id` on the
# server host (the one running server.toml). Each client MUST use a
# distinct identity_path; the default location is shared with the server.

server_node_id = "REPLACE_ME_WITH_SERVER_NODE_ID_FROM_meshly-core-client-id"
group_token = "long-random-string-shared-with-clients"

[common]
identity_path = "./keys/provider.key"

[common.logging]
level = "info"

[[expose]]
name = "web"
local_addr = "127.0.0.1:18081"
shared_secret = "web-secret"